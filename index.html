<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f2cd">
<title>家庭補貨清單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<style>
/* Layout: 奶油黃底、彩色圓角卡片、底部黑色膠囊導覽列（外觀覆蓋層在樣式表最後面） */
:root{
  --bg:#f6f2cd; --bg-alt:#f6f2cd; --surface:#fffdea; --tile:#ece6b4; --tile-2:#e2dba0; --seg-on:#fffdea;
  --fg:#1a1a17; --fg-2:#5f5c44; --fg-3:#8a8668; --line:#e0d99c; --line-soft:#e9e3b0;
  --accent:#ff8a65; --accent-press:#f2764f; --link:#b8431f; --on-accent:#1a1a17; --accent-soft:rgba(255,138,101,.20);
  --btn:#141412; --on-btn:#fffbe0; --btn-press:#33332e;
  --ok:#2f7d4f; --ok-soft:rgba(47,125,79,.16); --warn:#a84a08; --warn-soft:rgba(214,110,20,.16); --danger:#c42b1c;
  --glass:rgba(246,242,205,.82); --scrim:rgba(20,20,10,.4);
  --shadow:0 12px 32px rgba(70,60,0,.12); --shadow-sm:none;
  --c1:#ff8a65; --c2:#b9cdf7; --c3:#fff46e; --c4:#bdeedd; --on-c:#1a1a17;
  --pill-bg:#141412; --pill-fg:#bdb99a; --pill-on-bg:#ffd75e; --pill-on-fg:#141412;
  /* 給店員掃描的畫面永遠白底黑字，兩種主題都一樣 */
  --scan-bg:#ffffff; --scan-fg:#000000; --scan-fg-2:#515154; --scan-tile:#f5f5f7; --scan-line:#d2d2d7; --scan-link:#0066cc; --scan-accent:#0071e3;
  --finish:#248a3d; --finish-press:#1e7533;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
  --t-hero:clamp(34px,8vw,46px); --t-h1:clamp(30px,6vw,42px); --t-h2:22px;
  --r-lg:28px; --r-md:22px; --r-sm:14px;
  --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1c1a; --bg-alt:#1c1c1a; --surface:#2a2a27; --tile:#363632; --tile-2:#44443e; --seg-on:#55554d;
    --fg:#f6f2d8; --fg-2:#bdb99a; --fg-3:#8f8b72; --line:#46463f; --line-soft:#363632;
    --accent:#ff8a65; --accent-press:#ff9d7e; --link:#ffa27f; --on-accent:#1a1a17; --accent-soft:rgba(255,138,101,.22);
    --btn:#ffd75e; --on-btn:#141412; --btn-press:#ffe385;
    --ok:#6fd79a; --ok-soft:rgba(111,215,154,.18); --warn:#ffb25e; --warn-soft:rgba(255,178,94,.18); --danger:#ff7a6b;
    --glass:rgba(28,28,26,.82); --scrim:rgba(0,0,0,.6);
    --shadow:0 12px 32px rgba(0,0,0,.5); --shadow-sm:none;
    --pill-bg:#0d0d0c; --pill-fg:#a8a48a; --pill-on-bg:#ffd75e; --pill-on-fg:#141412;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1c1a; --bg-alt:#1c1c1a; --surface:#2a2a27; --tile:#363632; --tile-2:#44443e; --seg-on:#55554d;
  --fg:#f6f2d8; --fg-2:#bdb99a; --fg-3:#8f8b72; --line:#46463f; --line-soft:#363632;
  --accent:#ff8a65; --accent-press:#ff9d7e; --link:#ffa27f; --on-accent:#1a1a17; --accent-soft:rgba(255,138,101,.22);
  --btn:#ffd75e; --on-btn:#141412; --btn-press:#ffe385;
  --ok:#6fd79a; --ok-soft:rgba(111,215,154,.18); --warn:#ffb25e; --warn-soft:rgba(255,178,94,.18); --danger:#ff7a6b;
  --glass:rgba(28,28,26,.82); --scrim:rgba(0,0,0,.6);
  --shadow:0 12px 32px rgba(0,0,0,.5); --shadow-sm:none;
  --pill-bg:#0d0d0c; --pill-fg:#a8a48a; --pill-on-bg:#ffd75e; --pill-on-fg:#141412;
  color-scheme:dark;
}

html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:.01em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
*,*::before,*::after{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
h1,h2,h3,h4{text-wrap:balance}
p{margin:0}
.muted{color:var(--fg-2)}
.center{text-align:center}
.wrap{max-width:1012px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ── 導覽列 ── */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line-soft)}
.nav .wrap{display:flex;align-items:center;gap:6px;height:48px}
.brand{font-weight:600;font-size:17px;margin-right:auto;white-space:nowrap;letter-spacing:0}
.nav-links{display:flex;gap:2px}
.nav-links button{font-size:14px;color:var(--fg-2);padding:6px 11px;border-radius:980px;transition:color .2s,background .2s}
.nav-links button:hover{color:var(--fg)}
.nav-links button[aria-current="page"]{color:var(--fg);background:var(--tile)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-3);margin-left:6px;white-space:nowrap;min-height:32px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--fg-3)}
.sync[data-mode="cloud"] i{background:var(--ok)}
.sync[data-mode="local"] i{background:var(--warn)}
@media (max-width:520px){.sync span{display:none}.brand{font-size:16px}.nav-links button{padding:6px 9px}}

/* ── 色帶與標題 ── */
.band{padding-block:56px}
.band.alt{background:var(--bg-alt)}
.band.tight{padding-block:28px 8px}
.hero{padding-block:76px 52px;text-align:center}
.hero.sm{padding-block:64px 40px}
.hero-title{font-size:var(--t-hero);font-weight:700;letter-spacing:-.03em;line-height:1.04;margin:0}
.list-title{font-size:var(--t-h1);font-weight:700;letter-spacing:-.02em;line-height:1.08;margin:0}
.tagline{font-size:clamp(21px,3.2vw,28px);font-weight:600;margin-top:14px;letter-spacing:-.005em;text-wrap:balance}
.hero-status{color:var(--fg-2);margin-top:10px}
.eyebrow{font-size:17px;font-weight:600;color:var(--fg-2);margin-bottom:8px}
.cta-row{display:flex;gap:12px 24px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:28px}
.section-title{font-size:var(--t-h2);font-weight:700;letter-spacing:-.015em;line-height:1.1;margin:0 0 28px}
.back{margin-bottom:18px}

/* ── 按鈕 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 22px;border-radius:980px;font-size:17px;font-weight:500;white-space:nowrap;text-decoration:none;transition:background .2s,transform .15s,opacity .2s}
.btn:hover{text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-press)}
.btn-secondary{background:var(--tile);color:var(--fg)}
.btn-secondary:hover{background:var(--tile-2)}
.btn-danger{background:var(--tile);color:var(--danger)}
.btn-sm{min-height:36px;padding:6px 16px;font-size:15px}
.btn-wide{width:100%}
.btn-link{color:var(--link);font-size:17px;min-height:44px;display:inline-flex;align-items:center}
.btn-link:hover{text-decoration:underline}
button:disabled,.btn[aria-disabled="true"]{opacity:.38;cursor:not-allowed;transform:none}

/* ── 小標籤 ── */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:980px;background:var(--tile);color:var(--fg-2);white-space:nowrap;letter-spacing:.02em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.accent{background:var(--accent-soft);color:var(--link)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:6px 14px;border-radius:980px;background:var(--tile);font-size:14px;font-weight:500;color:var(--fg);transition:background .2s}
.chip:hover{background:var(--tile-2)}
.chip[aria-pressed="true"],.chip[aria-pressed="true"]:hover{background:var(--fg);color:var(--bg)}
.chip.quiet{background:transparent;color:var(--fg-2)}
.chip.quiet:hover{color:var(--danger);background:var(--tile)}

/* ── 提醒橫幅 ── */
.banners{display:grid;gap:12px;margin-bottom:48px}
.banner{display:flex;align-items:center;gap:14px 16px;flex-wrap:wrap;background:var(--surface);border-radius:var(--r-md);padding:16px 20px;box-shadow:var(--shadow-sm)}
.banner .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.banner.warn .dot{background:var(--warn)}
.banner.ok .dot{background:var(--ok)}
.banner-text{flex:1 1 220px;min-width:0}
.banner-text strong{display:block;font-weight:600}
.banner-text p{color:var(--fg-2);font-size:14px;margin-top:2px}
.banner-acts{display:flex;gap:8px;flex-wrap:wrap}
.list-banner{margin-bottom:36px}

/* ── 清單卡 ── */
.list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:20px}
.list-card{background:var(--surface);border-radius:var(--r-lg);padding:28px 28px 24px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;transition:transform .35s var(--ease),box-shadow .35s;min-width:0}
.list-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.lc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.lc-store{font-size:14px;color:var(--fg-2);font-weight:600}
.lc-pills{display:flex;gap:6px;flex-wrap:wrap}
.lc-title{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:0;overflow-wrap:anywhere}
.lc-stack{display:flex;justify-content:center;margin:20px 0 16px;overflow:hidden}
.lc-stack .th{width:clamp(56px,17vw,84px);height:clamp(56px,17vw,84px);margin-left:-14px;border:4px solid var(--surface);border-radius:22px}
.lc-stack .th:first-child{margin-left:0}
.lc-stack .th .mono{font-size:clamp(20px,5vw,28px)}
.progress{height:4px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .6s var(--ease)}
.lc-meta{font-size:14px;color:var(--fg-2);margin-top:10px;display:flex;flex-wrap:wrap;gap:2px 14px;font-variant-numeric:tabular-nums}

/* ── 縮圖 ── */
.th{flex:none;display:grid;place-items:center;background:var(--tile);border-radius:14px;overflow:hidden;width:56px;height:56px}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.mono{font-size:24px;font-weight:600;color:var(--fg-2);line-height:1}

/* ── 空狀態 ── */
.empty{background:var(--surface);border-radius:var(--r-lg);padding:48px 24px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h3{font-size:28px;margin:0;font-weight:700;letter-spacing:-.01em}
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin:16px 0 4px;width:100%;max-width:720px;text-align:left}
.step{background:var(--tile);border-radius:var(--r-md);padding:18px;display:grid;gap:4px}
.step b{font-size:13px;color:var(--fg-3);font-weight:600;font-variant-numeric:tabular-nums}
.step strong{font-size:17px}
.step span{font-size:14px;color:var(--fg-2)}

/* ── 清單項目 ── */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px;flex-wrap:wrap}
.sec-head h2,.sec-head h3{font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em}
.sec-head .count{color:var(--fg-3);font-weight:600;margin-left:6px}
.group{margin-top:44px}
.hint{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--accent-soft);color:var(--fg);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5}
.hint.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.more{border-top:1px solid var(--line-soft);padding-top:6px}
.more summary{cursor:pointer;color:var(--link);font-weight:600;font-size:15px;padding:10px 0;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:" ›";display:inline-block;transition:transform .2s}
.more[open] summary::after{transform:rotate(90deg)}
.members{display:grid;gap:8px}
.member{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--tile);border-radius:12px;padding:10px 14px}
.member>span:first-child{display:grid;min-width:0}
.member small{color:var(--fg-2);font-size:13px;overflow-wrap:anywhere}
.cam{position:fixed;inset:0;z-index:110;background:#000000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.cam video{width:100%;max-width:640px;max-height:68vh;object-fit:cover;border-radius:20px;background:#111111}
.cam-tip{color:#ffffff;font-size:17px}
.cam-acts{display:flex;gap:12px}
.cam .btn-secondary{background:#2c2c2e;color:#ffffff}
.store-sub{font-size:15px;font-weight:600;color:var(--fg-2);margin:24px 0 10px;letter-spacing:.02em}
.store-sub:first-of-type{margin-top:0}
input[type="date"]{width:100%;min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.items{display:grid;gap:12px}
.item{display:grid;grid-template-columns:44px 76px minmax(0,1fr);gap:14px;align-items:start;background:var(--surface);border-radius:var(--r-md);padding:16px;transition:opacity .3s}
.check{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.check>span{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--on-accent);transition:background .2s,border-color .2s}
.check svg{width:15px;height:15px;opacity:0;transition:opacity .2s}
.item.bought .check>span{background:var(--accent);border-color:var(--accent)}
.item.bought .check svg{opacity:1}
.item.bought .item-name{color:var(--fg-3)}
.item.bought .th{opacity:.6}
.item .th{width:76px;height:76px;border-radius:16px}
.item .th .mono{font-size:28px}
.item-name{font-size:19px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.item-name .x{color:var(--fg-2);font-weight:500;margin-left:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.item-sub{color:var(--fg-2);font-size:15px;margin-top:2px;overflow-wrap:anywhere}
.item-code{font-family:var(--mono);font-size:14px;margin-top:4px}
.item-note{font-size:14px;background:var(--tile);border-radius:10px;padding:6px 10px;margin-top:8px;display:inline-block;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.item-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.stepper{display:inline-flex;align-items:center;background:var(--tile);border-radius:980px;height:36px}
.stepper button{width:38px;height:36px;border-radius:980px;font-size:20px;line-height:1;color:var(--link)}
.stepper output{min-width:22px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.item-by{font-size:12px;color:var(--fg-3);margin-top:10px}
.items-empty{background:var(--surface);border-radius:var(--r-md);padding:28px;text-align:center;color:var(--fg-2)}
@media (max-width:520px){
  .item{grid-template-columns:36px 60px minmax(0,1fr);gap:10px;padding:14px 12px}
  .item .th{width:60px;height:60px;border-radius:14px}
  .item .th .mono{font-size:22px}
  .check{width:36px;height:44px}
}

/* ── 通知區 ── */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px}
.tile{background:var(--bg-alt);border-radius:var(--r-md);padding:24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.band.alt .tile{background:var(--surface)}
.tile h3{font-size:19px;margin:0;font-weight:600}
.tile>p{color:var(--fg-2);font-size:14px}
.tile .btn{margin-top:auto;align-self:flex-start}
.tile.span2{grid-column:span 2}
@media (max-width:520px){.tile.span2{grid-column:auto}}
.text-preview{margin-top:28px}
.text-preview textarea{font-size:14px;line-height:1.6;color:var(--fg-2);resize:vertical}

/* ── 表單 ── */
.form{display:grid;gap:18px}
.field{display:grid;gap:6px;border:0;padding:0;margin:0;min-width:0}
.field>span,.field>legend{font-size:14px;font-weight:600;color:var(--fg-2);padding:0;margin-bottom:6px}
input[type="text"],input[type="email"],input[type="search"],input[type="datetime-local"],input:not([type]),select,textarea{width:100%;min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:17px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--fg-2) 50%),linear-gradient(135deg,var(--fg-2) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea{min-height:80px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.field-row{grid-template-columns:1fr}}
.input-row{display:flex;gap:8px}
.input-row input{flex:1;min-width:0}
.help{font-size:13px;color:var(--fg-3)}
.help.ok{color:var(--ok)}
.help.warn{color:var(--warn)}
.seg{display:inline-flex;background:var(--tile);border-radius:12px;padding:3px;gap:2px;justify-self:start}
.seg button{padding:8px 18px;border-radius:9px;font-size:15px;font-weight:500;color:var(--fg-2);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--fg-2);min-height:40px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.photo-frame{width:min(100%,280px);aspect-ratio:1;max-width:100%;margin:0 auto;border-radius:var(--r-lg);background:var(--tile);display:grid;place-items:center;overflow:hidden}
.photo-frame img{width:100%;height:100%;object-fit:cover}
.photo-frame .mono{font-size:72px;color:var(--fg-3)}
.photo-frame.tag{width:min(100%,200px)}
.photo-acts{display:flex;justify-content:center;gap:8px 16px;flex-wrap:wrap;margin-top:12px}
.form-actions{display:grid;gap:10px;margin-top:6px}

/* ── 面板 ── */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s ease}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;border-radius:var(--r-lg) var(--r-lg) 0 0;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));animation:up .4s var(--ease)}
.sheet-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px max(20px,env(safe-area-inset-right,0px)) 14px max(20px,env(safe-area-inset-left,0px));background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.sheet-head h2{font-size:21px;font-weight:700;margin:0;overflow-wrap:anywhere;min-width:0}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--tile);color:var(--fg-2);display:grid;place-items:center;flex:none;font-size:15px}
.sheet-body{padding:8px max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
@media (min-width:720px){.scrim{align-items:center;padding:24px}.sheet{border-radius:var(--r-lg);max-height:88vh;padding-bottom:28px}}

.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.store-tile{border:2px solid transparent;background:var(--tile);border-radius:var(--r-md);padding:16px;text-align:left;display:grid;gap:2px;transition:border-color .2s,background .2s}
.store-tile b{font-size:21px;font-weight:700}
.store-tile small{color:var(--fg-2);font-size:13px}
.store-tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* ── 挑商品 ── */
.picker-top{display:grid;gap:6px;position:sticky;top:68px;z-index:1;background:var(--bg);padding-block:4px 10px}
.pk-cat{font-size:14px;color:var(--fg-3);font-weight:600;margin:22px 0 8px}
.pk-rows{display:grid;gap:8px}
.pk-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border-radius:14px;background:var(--bg-alt)}
.pk-row .th{width:52px;height:52px;border-radius:12px}
.pk-row .th .mono{font-size:20px}
.pk-text{min-width:0;display:grid}
.pk-text strong{font-weight:600;overflow-wrap:anywhere}
.pk-text span{font-size:13px;color:var(--fg-2);overflow-wrap:anywhere}
.pk-empty{padding:28px 0;text-align:center;color:var(--fg-2);display:grid;gap:4px}
.picker-new{margin-top:32px;padding-top:24px;border-top:1px solid var(--line-soft)}
.picker-new h3{font-size:19px;margin:0 0 4px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:4px;margin-top:14px}

/* ── 商品頁 ── */
.filter-row{display:grid;gap:14px}
.cat-scroll{display:flex;gap:4px;overflow-x:auto;padding:16px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-btn{flex:none;display:grid;justify-items:center;gap:6px;width:74px;padding:6px 0;border-radius:14px;scroll-snap-align:start;position:relative}
.mono-tile{width:56px;height:56px;border-radius:16px;background:var(--tile);display:grid;place-items:center;font-size:22px;font-weight:600;color:var(--fg-2);transition:background .2s,color .2s,transform .2s}
.cat-btn:hover .mono-tile{transform:scale(1.05)}
.cat-btn>span:not(.mono-tile){font-size:12px;color:var(--fg-2);white-space:nowrap}
.cat-btn[aria-pressed="true"] .mono-tile{background:var(--fg);color:var(--bg)}
.cat-btn[aria-pressed="true"]>span:not(.mono-tile){color:var(--fg);font-weight:600}
.cat-btn .n{position:absolute;top:2px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:16px}
@media (max-width:520px){.prod-grid{grid-template-columns:1fr 1fr;gap:12px}}
.prod-card{background:var(--surface);border-radius:var(--r-md);overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .35s var(--ease),box-shadow .35s;min-width:0}
.prod-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.prod-card .ph{aspect-ratio:1;max-width:100%;background:var(--surface);display:grid;place-items:center;overflow:hidden}
.prod-card .ph img{width:100%;height:100%;object-fit:cover}
.prod-card .ph .mono{font-size:clamp(40px,9vw,60px);color:var(--fg-3)}
.pc-body{padding:14px 16px 18px;display:grid;gap:2px;min-width:0}
.pc-cat{font-size:12px;font-weight:600;color:var(--fg-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pc-name{font-size:17px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.pc-sub{font-size:14px;color:var(--fg-2);overflow-wrap:anywhere}
.pc-stores{font-size:12px;color:var(--fg-3);margin-top:6px}

.pd{display:grid;gap:6px;text-align:center;padding-top:8px}
.pd-photo{width:min(100%,340px);aspect-ratio:1;max-width:100%;margin:0 auto 18px;border-radius:var(--r-lg);background:var(--tile);display:grid;place-items:center;overflow:hidden}
.pd-photo img{width:100%;height:100%;object-fit:cover}
.pd-photo .mono{font-size:96px;color:var(--fg-3)}
.pd-cat{font-size:14px;font-weight:600;color:var(--fg-2)}
.pd-name{font-size:clamp(30px,6vw,40px);font-weight:700;letter-spacing:-.015em;line-height:1.1;margin:0}
.pd-sub{font-size:19px;color:var(--fg-2)}
.pd-acts{display:flex;justify-content:center;gap:10px 16px;flex-wrap:wrap;margin-top:18px}
.facts{display:grid;margin:28px 0 0;text-align:left;border-top:1px solid var(--line-soft)}
.fact{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft);align-items:start}
.fact dt{color:var(--fg-2);font-size:14px;padding-top:2px}
.fact dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono-text{font-family:var(--mono);font-size:19px;letter-spacing:.04em}
.bc-box{background:var(--scan-bg);border-radius:12px;padding:6px;display:block;max-width:320px}
.bc-box svg{display:block;width:100%;height:auto}
.tag-img{max-width:220px;border-radius:12px}

/* ── 紀錄 ── */
.hist{display:grid;gap:14px}
.hist-card{background:var(--surface);border-radius:var(--r-md);padding:22px 24px;display:flex;gap:16px 24px;align-items:center;flex-wrap:wrap}
.hc-main{flex:1 1 260px;min-width:0;display:grid;gap:4px}
.hc-main h3{font-size:22px;margin:0;font-weight:700;overflow-wrap:anywhere}
.hc-main p{font-size:14px;color:var(--fg-2)}
.hc-act{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}

/* ── 底部結帳列 ── */
.cobar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line-soft);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.cobar .wrap{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;justify-content:space-between}
.cobar p{font-size:13px;color:var(--fg-2);flex:1 1 220px;min-width:0}
.cobar p strong{color:var(--fg);font-weight:600}
.cobar .btns{display:flex;gap:10px;flex:1 1 280px;justify-content:flex-end}
.cobar .btns .btn{flex:1;max-width:220px}
main.has-cobar{padding-bottom:150px}

/* ── 給店員看／載具（永遠白底） ── */
.scan{position:fixed;inset:0;z-index:90;background:var(--scan-bg);color:var(--scan-fg);overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:fade .25s ease;color-scheme:light}
.scan-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--scan-bg)}
.scan-top button{color:var(--scan-link);font-size:17px;font-weight:600;min-height:44px;padding:0 10px}
.scan-top button:disabled{opacity:.3}
.scan-title{font-size:15px;color:var(--scan-fg-2);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager{display:flex;align-items:center;gap:2px;font-size:15px;color:var(--scan-fg-2);font-variant-numeric:tabular-nums}
.pager button{font-size:26px;font-weight:400;width:44px}
.scan-body{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:8px max(20px,env(safe-area-inset-right,0px)) 48px max(20px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto;width:100%}
.scan-hint{font-size:15px;color:var(--scan-fg-2)}
.scan-photo{width:min(76vw,340px);aspect-ratio:1;max-width:100%;border-radius:var(--r-lg);overflow:hidden;background:var(--scan-tile);display:grid;place-items:center}
.scan-photo img{width:100%;height:100%;object-fit:cover}
.scan-photo .mono{font-size:96px;color:var(--scan-fg-2)}
.scan-name{font-size:clamp(32px,8.5vw,52px);font-weight:700;line-height:1.08;letter-spacing:-.02em;margin:4px 0 0;overflow-wrap:anywhere}
.scan-sub{font-size:19px;color:var(--scan-fg-2)}
.scan-itemno{display:grid;gap:2px;border:2px solid var(--scan-fg);border-radius:20px;padding:10px 28px 12px}
.scan-itemno span{font-size:12px;font-weight:700;letter-spacing:.12em}
.scan-itemno strong{font-family:var(--mono);font-size:clamp(36px,11vw,56px);letter-spacing:.06em;line-height:1.05}
.scan-bc{width:100%;max-width:520px;background:var(--scan-bg)}
.scan-bc svg{display:block;width:100%;height:auto;margin:0 auto}
.bc-digits{font-family:var(--mono);font-size:30px;letter-spacing:.12em;padding:12px;border:2px dashed var(--scan-line);border-radius:12px;color:var(--scan-fg);overflow-wrap:anywhere}
.scan-note{font-size:17px;background:var(--scan-tile);padding:10px 16px;border-radius:12px;overflow-wrap:anywhere}
.scan-tag{margin:0;display:grid;gap:6px;justify-items:center}
.scan-tag img{max-width:min(70vw,280px);border-radius:14px}
.scan-tag figcaption{font-size:13px;color:var(--scan-fg-2)}
.scan-tip{font-size:13px;color:var(--scan-fg-2);margin-top:6px}
.carrier-code{font-family:var(--mono);font-size:28px;letter-spacing:.1em}
.co-head{font-size:clamp(30px,8vw,44px);font-weight:700;letter-spacing:-.02em;margin:8px 0 0}
.co-sum{display:flex;justify-content:center;gap:40px;margin-top:6px}
.co-sum div{display:grid;justify-items:center}
.co-sum strong{font-size:44px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.co-sum span{font-size:14px;color:var(--scan-fg-2)}
.co-miss{font-size:15px;color:var(--scan-fg-2);max-width:460px;overflow-wrap:anywhere}
.ring{position:relative;width:128px;height:128px;margin-top:10px}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:8}
.ring .rbg{stroke:var(--scan-line)}
.ring .rfg{stroke:var(--scan-accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.scan .btn-secondary{background:var(--scan-tile);color:var(--scan-fg)}
.scan .btn-primary{background:var(--scan-accent);color:#ffffff}
.btn-finish{background:var(--finish);color:#ffffff}
.btn-finish:hover{background:var(--finish-press)}
.co-btns{display:flex;flex-direction:column;gap:12px;width:min(100%,280px);margin-top:8px}
.co-btns .btn{width:100%}
.done-mark{width:84px;height:84px;border-radius:50%;background:var(--scan-accent);display:grid;place-items:center;margin-top:20px}
.done-mark svg{width:40px;height:40px;color:#ffffff}

/* ── 頁尾、提示 ── */
.foot{background:var(--bg-alt);border-top:1px solid var(--line-soft);padding-block:20px 28px;font-size:12px;color:var(--fg-3)}
.foot p+p{margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:980px;font-size:15px;z-index:120;opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease);max-width:calc(100% - 32px);width:max-content;text-align:center;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
main.has-cobar ~ .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}

/* ── 動畫 ── */
.reveal{transition:opacity 1s var(--ease),transform 1s var(--ease)}
.reveal.pre{opacity:0;transform:translateY(40px)}
.rise{animation:rise 1s var(--ease) both}
.rise.d1{animation-delay:.08s}
.rise.d2{animation-delay:.16s}
@keyframes rise{from{opacity:.3;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(48px);opacity:.5}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal.pre{opacity:1;transform:none}
}

/* ══ 新版外觀：奶油黃底、彩色圓角卡片、底部黑色膠囊導覽列 ══ */
.wrap{max-width:760px}
.band,.band.alt{background:none}
.band{padding-block:14px}
.band.tight{padding-block:8px 0}
.hero,.hero.sm{padding-block:8px 6px;text-align:left}
.hero-title,.list-title{font-size:var(--t-hero);letter-spacing:-.02em;line-height:1.12}
.tagline{font-size:16px;font-weight:500;color:var(--fg-2);margin-top:6px}
.hero-status{margin-top:4px}
.cta-row{justify-content:flex-start;margin-top:16px}
.section-title{font-size:22px;margin:6px 0 14px}
.sec-head h2,.sec-head h3{font-size:20px}
.eyebrow{font-size:14px}
.btn-primary{background:var(--btn);color:var(--on-btn)}
.btn-primary:hover{background:var(--btn-press)}
.btn-link{color:var(--link)}
.pill.accent{color:var(--link)}
.foot{background:none;border:0;padding-block:12px 120px}

/* 頂列：品牌 + 同步狀態；導覽列變成底部黑色膠囊 */
.nav{position:static;background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none}
.nav .wrap{height:44px}
.brand{font-size:14px;font-weight:500;color:var(--fg-2)}
.nav-links{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:65;background:var(--pill-bg);border-radius:980px;padding:7px;gap:4px;box-shadow:var(--shadow)}
.nav-links button{white-space:nowrap;color:var(--pill-fg);font-size:15px;font-weight:500;padding:11px 18px;min-height:44px}
.nav-links button:hover{color:var(--pill-on-fg);background:none}
.nav-links button[aria-current="page"]{background:var(--pill-on-bg);color:var(--pill-on-fg)}
.nav-links button:not([aria-current="page"]):hover{color:#ffffff}

/* 首頁摘要卡（珊瑚色，像範例的 Balance 卡） */
.sum-card{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;background:var(--c1);color:var(--on-c);border-radius:var(--r-md);padding:20px 22px;margin-top:16px}
.sum-card small{display:block;font-size:14px;font-weight:500;opacity:.75}
.sum-card strong{display:block;font-size:44px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.sum-card .sum-r{text-align:right;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.sum-card .progress{background:rgba(0,0,0,.14);margin-top:12px;height:6px}
.sum-card .progress>i{background:var(--on-c)}
.sum-card.done{background:#a9bfa5}

/* 清單卡：四色輪流（珊瑚／淡藍／黃／薄荷），字永遠深色 */
.list-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.list-card{background:var(--c4);color:var(--on-c);border-radius:var(--r-md);padding:20px 20px 18px}
.list-card:nth-child(4n+1){background:var(--c2)}
.list-card:nth-child(4n+2){background:var(--c3)}
.list-card:nth-child(4n+3){background:var(--c4)}
.list-card:nth-child(4n+4){background:var(--c1)}
.list-card.list-card.done{background:#a9bfa5}
.list-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.lc-store,.lc-meta{color:rgba(26,26,23,.7)}
.lc-title{font-size:24px}
.lc-stack .th{border-color:transparent;background:rgba(255,255,255,.55);border-radius:18px;box-shadow:0 0 0 3px rgba(255,255,255,.55)}
.lc-stack .th .mono{color:var(--on-c)}
.list-card .progress{background:rgba(0,0,0,.14);height:6px}
.list-card .progress>i{background:var(--on-c)}
.list-card .pill{background:rgba(255,255,255,.6);color:var(--on-c)}
.banner{border:1px solid var(--line);box-shadow:none}
.empty{border:1px solid var(--line)}

/* 清單詳情（購買頁）：進度卡、圓角商品卡、膠囊數量器 */
.prog-card{background:var(--c1);color:var(--on-c);border-radius:var(--r-md);padding:18px 22px;margin-top:16px;display:grid;gap:10px}
.prog-card .pc-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.prog-card strong{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.prog-card span{font-size:14px;font-weight:600;opacity:.8}
.prog-card .progress{background:rgba(0,0,0,.14);height:8px}
.prog-card .progress>i{background:var(--on-c)}
.prog-card.done{background:#a9bfa5}
.items{gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.item .th{background:var(--tile);border-radius:18px}
.item-name{font-size:18px}
.item-note{background:var(--c3);color:var(--on-c)}
.item.bought{background:transparent}
.stepper{background:var(--bg);border:1px solid var(--line);height:38px}
.stepper button{color:var(--fg);width:36px;height:36px}
.check>span{border-color:var(--fg-3)}
.store-sub{display:inline-block;background:var(--c2);color:var(--on-c);padding:4px 14px;border-radius:980px;font-size:14px;margin:22px 0 12px}
.store-sub:first-of-type{margin-top:0}

/* 底部結帳列：浮在黑色導覽膠囊上方的黑色圓角卡 */
.cobar{left:50%;right:auto;transform:translateX(-50%);width:min(calc(100% - 24px),736px);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--pill-bg);border:0;border-radius:24px;padding:12px 14px;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:var(--shadow);z-index:55}
.cobar .wrap{max-width:720px;padding:0}
.cobar p{color:var(--pill-fg)}
.cobar p strong{color:#fffbe0}
.cobar .btn-primary{background:var(--pill-on-bg);color:var(--pill-on-fg)}
.cobar .btn-secondary{background:rgba(255,255,255,.14);color:#fffbe0}
main.has-cobar{padding-bottom:90px}
@media (max-width:520px){.cobar p{display:none}.cobar .btns{flex:1 1 100%;max-width:none}.cobar .btns .btn{max-width:none}}
.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
main.has-cobar ~ .toast{bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.scrim{z-index:85}
.pd-buy{position:sticky;bottom:0;margin:24px -4px 0;padding:14px 4px calc(6px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.buy-rows{display:grid;gap:8px}
.buy-row{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;font-size:20px}
.buy-row strong{display:block;font-size:17px;font-weight:600}
.buy-row small{display:block;font-size:13px;color:var(--fg-2)}
.buy-row:hover{background:var(--tile)}
.sheet{background:var(--bg)}
.tile,.band.alt .tile{background:var(--surface);border:1px solid var(--line)}

/* 條碼 */
function ean13ok(s) { if (!/^\d{13}$/.test(s)) return false; let t = 0; for (let i = 0; i < 12; i++) t += (+s[i]) * (i % 2 ? 3 : 1); return (10 - t % 10) % 10 === +s[12]; }
function ean8ok(s) { if (!/^\d{8}$/.test(s)) return false; let t = 0; for (let i = 0; i < 7; i++) t += (+s[i]) * (i % 2 ? 1 : 3); return (10 - t % 10) % 10 === +s[7]; }
function upcOk(s) { return /^\d{12}$/.test(s) && ean13ok('0' + s); }
function bcFormat(code) { if (ean13ok(code)) return 'EAN13'; if (ean8ok(code)) return 'EAN8'; if (upcOk(code)) return 'UPC'; return 'CODE128'; }
function cleanCode(v) { return String(v || '').trim().replace(/[^0-9A-Za-z\-]/g, '').slice(0, 32); }

function drawBarcodes(root) {
  $$('svg[data-bc]', root).forEach(svg => {
    const code = svg.getAttribute('data-bc');
    const fmt = svg.getAttribute('data-fmt') || bcFormat(code);
    const opts = { format: fmt, width: +(svg.getAttribute('data-w') || 2), height: +(svg.getAttribute('data-h') || 80), displayValue: true, fontSize: 18, textMargin: 4, margin: 10, background: '#ffffff', lineColor: '#000000', font: 'monospace' };
    const fallback = () => { const d = document.createElement('div'); d.className = 'bc-digits'; d.textContent = code; svg.replaceWith(d); };
    if (typeof window.JsBarcode !== 'function') return fallback();
    try { window.JsBarcode(svg, code, opts); }
    catch (e) { try { opts.format = 'CODE128'; window.JsBarcode(svg, code, opts); } catch (e2) { return fallback(); } }
    const w = parseFloat(svg.getAttribute('width')), h = parseFloat(svg.getAttribute('height'));
    if (w && h) { svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h); svg.removeAttribute('width'); svg.removeAttribute('height'); svg.style.maxWidth = w + 'px'; }
  });
}

/* 照片壓縮（約 100KB 以內）與條碼辨識 */
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { res(img); setTimeout(() => URL.revokeObjectURL(url), 2000); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}
async function compressImage(file, maxSide, maxChars) {
  const img = await loadImage(file);
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  let scale = Math.min(1, maxSide / Math.max(w, h)), q = 0.82, out = '';
  for (let i = 0; i < 10; i++) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * scale)); c.height = Math.max(1, Math.round(h * scale));
    const x = c.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    out = c.toDataURL('image/jpeg', q);
    if (out.length <= maxChars) return out;
    if (q > 0.5) q -= 0.1; else scale *= 0.8;
  }
  if (out.length > maxChars) throw new Error('too big');
  return out;
}
let zxingP = null;
function loadZXing() {
  if (window.ZXing) return Promise.resolve(window.ZXing);
  if (zxingP) return zxingP;
  zxingP = new Promise(res => {
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js';
    s.onload = () => res(window.ZXing || null);
    s.onerror = () => { zxingP = null; res(null); };
    document.head.appendChild(s);
  });
  return zxingP;
}
function imgCanvas(img, maxSide, rotate) {
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const sc = Math.min(1, maxSide / Math.max(w, h)), sw = Math.round(w * sc), sh = Math.round(h * sc);
  const c = document.createElement('canvas'); const x = c.getContext('2d');
  if (rotate) { c.width = sh; c.height = sw; x.translate(sh, 0); x.rotate(Math.PI / 2); } else { c.width = sw; c.height = sh; }
  x.drawImage(img, 0, 0, sw, sh);
  return c;
}
async function decodeBarcode(file) {
  const img = await loadImage(file);
  return decodeCanvasList([imgCanvas(img, 1400, false), imgCanvas(img, 1400, true)]);
}
async function decodeCanvasList(canvases, skipDetector) {
  if (!skipDetector && 'BarcodeDetector' in window) {
    try {
      const det = new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39'] });
      for (const c of canvases) { const r = await det.detect(c); if (r && r[0] && r[0].rawValue) return r[0].rawValue; }
    } catch (e) { /* 換 ZXing */ }
  }
  const Z = await loadZXing();
  if (!Z) return null;
  const hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  const reader = new Z.MultiFormatReader(); reader.setHints(hints);
  for (const c of canvases) {
    const data = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
    const lum = new Uint8ClampedArray(c.width * c.height);
    for (let i = 0, j = 0; i < lum.length; i++, j += 4) lum[i] = (data[j] * 299 + data[j + 1] * 587 + data[j + 2] * 114) / 1000;
    for (const Bin of [Z.HybridBinarizer, Z.GlobalHistogramBinarizer]) {
      try {
        const src = new Z.RGBLuminanceSource(lum, c.width, c.height);
        const res = reader.decode(new Z.BinaryBitmap(new Bin(src)), hints);
        if (res) return res.getText();
      } catch (e) { /* 這個方向沒讀到 */ }
    }
  }
  return null;
}

function enqueue(path, fn) { const p = (qChain.all || Promise.resolve()).catch(() => {}).then(fn); qChain.all = p; return p; } // 依序寫入，避免項目比清單先到
function guard() { if (!CAN_WRITE) { toast('你目前只能看，不能修改。請擁有者把你設成可編輯。', 4000); return false; } return true; }

  catch (e) { toast('這台裝置的空間不夠，照片可能沒存到。'); }

function put(col, id, obj) {
  if (!guard()) return Promise.resolve();
  const body = Object.assign({}, obj, { by: ME || 'local', at: Date.now() });
  const isNew = !D[col][id];
  if (!body.owner) body.owner = (D[col][id] && (D[col][id].owner || D[col][id].createdBy)) || ME || 'local';
  D[col] = Object.assign({}, D[col], { [id]: body });
  scheduleRender();
  if (MODE === 'cloud') return enqueue(col + '/' + id, () => sbUpsert(col, id, body, isNew && col === 'lists')).catch(onWriteError);
  saveLocal(); return Promise.resolve();
}
function patch(col, id, fields) {
  if (!guard()) return Promise.resolve();
  const cur = D[col][id]; if (!cur) return Promise.resolve();
  const f = Object.assign({}, fields, { by: ME || 'local', at: Date.now() });
  D[col] = Object.assign({}, D[col], { [id]: Object.assign({}, cur, f) });
  scheduleRender();
  if (MODE === 'cloud') return enqueue(col + '/' + id, () => (D[col][id] ? sbUpsert(col, id, D[col][id]) : null)).catch(onWriteError);
  saveLocal(); return Promise.resolve();
}
function remove(col, id) {
  if (!guard()) return Promise.resolve();
  const next = Object.assign({}, D[col]); delete next[id]; D[col] = next;
  scheduleRender();
  if (MODE === 'cloud') return enqueue(col + '/' + id, () => sbDelete(col, id)).catch(onWriteError);
  saveLocal(); return Promise.resolve();
}
function setQty(itemId, qty) {

  D.items = Object.assign({}, D.items, { [itemId]: Object.assign({}, it, { qty }) });
  scheduleRender();
  clearTimeout(qtyTimers[itemId]);
  qtyTimers[itemId] = setTimeout(() => { delete PENDING_QTY[itemId]; patch('items', itemId, { qty }); }, 450);
}

async function sbUpsert(col, id, data, insertOnly) {

async function cloudLoadAll() {

  for (let from = 0; ; from += step) {
    const { data, error } = await SB.from('docs').select('col,id,data').range(from, from + step - 1);
    if (error) throw error;
    (data || []).forEach(r => { if (next[r.col]) next[r.col][r.id] = r.data; });
    if (!data || data.length < step) break;
  }
  for (const id in PENDING_QTY) if (next.items[id]) next.items[id] = Object.assign({}, next.items[id], { qty: PENDING_QTY[id] });
  D.products = next.products; D.lists = next.lists; D.items = next.items;

  scheduleRender();
}
function announceOne(col, prev, d, type) {

    else if (prev && prev.qty !== d.qty) msg = who + ' 把「' + (d.name || '商品') + '」改成 ' + d.qty + ' 個';

    if (type === 'INSERT') msg = who + ' 開了新清單「' + d.title + '」';

}
function subscribeRealtime() {
  SB.channel('docs-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, p => {
      if (p.eventType === 'DELETE') {
        const o = p.old || {}; if (!D[o.col]) return;
        const next = Object.assign({}, D[o.col]); delete next[o.id]; D[o.col] = next;
      } else {
        const n = p.new || {}; if (!D[n.col]) return;
        let data = n.data;

        try { announceOne(n.col, D[n.col][n.id], data, p.eventType); } catch (e) { /* 忽略 */ }

/* 分享文字與連結 */
function listText(l) {
  const its = itemsOf(l._id);
  const lines = ['【補貨清單】' + l.title];
  if (l.dueAt) lines.push('期限：' + fmtDue(l.dueAt) + ' 前買好');
  if (l.remindAt) lines.push('提醒：' + fmtRemind(l.remindAt));
  let n = 0;
  listStores(l._id).forEach(sid => {
  lines.push('', '▍' + storeOf(sid).name);
  its.filter(it => itemStore(it) === sid).forEach(it => {
    const i = n++;
    const p = prodOf(it);
    let s = (i + 1) + '. ' + p.name + ' × ' + it.qty;
    const bs = [p.brand, p.spec].filter(Boolean).join(' ');
    if (bs) s += '｜' + bs;
    if (p.itemNo && sid === 'costco') s += '｜Item ' + p.itemNo;
    s += p.sub ? '｜可替代' : '｜不可替代';
    if (it.state === 'bought') s += '（已買）';
    lines.push(s);
    if (p.note) lines.push('   備註：' + p.note);
  });
  });
  if (!its.length) lines.push('（還沒有商品）');
  if (APP_URL) lines.push('', '線上清單：' + APP_URL);
  return lines.join('\n');
}
function doneText(l) {
  const its = itemsOf(l._id), b = its.filter(i => i.state === 'bought'), nb = its.filter(i => i.state !== 'bought');
  let s = '【買好了】' + l.title + '\n已買 ' + b.length + ' 項';
  if (nb.length) s += '\n沒買到：' + nb.map(i => prodOf(i).name + (i.state === 'out' ? '（缺貨）' : '')).join('、');
  const subs = b.filter(i => i.subbed);
  if (subs.length) s += '\n買了替代品：' + subs.map(i => prodOf(i).name).join('、');
  return s;
}
function mailtoUrl(l, text) { return 'mailto:?subject=' + enc('補貨清單：' + l.title) + '&body=' + enc(text); }
function icsEsc(v) { return String(v).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); }
function icsText(l) {
  const f = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const ymd = ms => toDateInput(ms).replace(/-/g, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//restock//zh-TW', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT', 'UID:' + l._id + '@restock', 'DTSTAMP:' + f(new Date())];
  if (l.remindAt) L.push('DTSTART:' + f(new Date(l.remindAt)), 'DTEND:' + f(new Date(l.remindAt + 1800000)));
  else L.push('DTSTART;VALUE=DATE:' + ymd(l.dueAt), 'DTEND;VALUE=DATE:' + ymd(l.dueAt + 36 * 3600000));
  L.push('SUMMARY:' + icsEsc('買東西：' + l.title), 'DESCRIPTION:' + icsEsc(listText(l)));
  L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc('該去買：' + l.title), 'TRIGGER:' + (l.remindAt ? '-PT0M' : '-PT15H'), 'END:VALARM');
  L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc('清單還沒買完的話記得買'), 'TRIGGER:' + (l.remindAt ? 'PT2H' : 'PT12H'), 'END:VALARM');
  L.push('END:VEVENT', 'END:VCALENDAR');
  return L.join('\r\n');
}
function downloadIcs(l) {
  const url = URL.createObjectURL(new Blob([icsText(l)], { type: 'text/calendar;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = '補貨-' + l.title.replace(/[\\/:*?"<>|]/g, '') + '.ics';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function lineUrl(text) { return 'https://line.me/R/share?text=' + enc(text); }
function mailUrl(l, text) { return 'https://mail.google.com/mail/?view=cm&fs=1&su=' + enc('補貨清單：' + l.title) + '&body=' + enc(text); }
function gcalUrl(l) {
  const f = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');

/* ── 相機即時掃條碼 ── */
let camStream = null;
function stopCam() { if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; } $('#cam-root').innerHTML = ''; }
async function liveScan() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return { fallback: true };
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false }); }
  catch (e) { return { fallback: true }; }
  camStream = stream;
  $('#cam-root').innerHTML = '<div class="cam" role="dialog" aria-label="掃描條碼"><video id="cam-v" playsinline muted autoplay></video><p class="cam-tip">把條碼放在畫面中間，拿穩</p><div class="cam-acts"><button class="btn btn-secondary" id="cam-photo">改用拍照</button><button class="btn btn-secondary" id="cam-cancel">取消</button></div></div>';
  const v = $('#cam-v'); v.srcObject = stream; try { await v.play(); } catch (e) { /* 等使用者 */ }
  let det = null;
  if ('BarcodeDetector' in window) { try { det = new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39'] }); } catch (e) { det = null; } }
  if (!det) loadZXing();
  return new Promise(res => {
    let done = false;
    const finish = r => { if (done) return; done = true; stopCam(); res(r); };
    $('#cam-cancel').onclick = () => finish({ cancel: true });
    $('#cam-photo').onclick = () => finish({ fallback: true });
    const c = document.createElement('canvas');
    const tick = async () => {
      if (done) return;
      try {
        if (v.readyState >= 2) {
          let code = null;
          if (det) { const r = await det.detect(v); code = r && r[0] && r[0].rawValue; }
          else if (window.ZXing) { const w = v.videoWidth, h = v.videoHeight, sc = Math.min(1, 960 / Math.max(w, h)); c.width = (w * sc) | 0; c.height = (h * sc) | 0; c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); code = await decodeCanvasList([c], true); }
          if (code) { if (navigator.vibrate) navigator.vibrate(60); finish({ code }); return; }
        }
      } catch (e) { /* 下一格再試 */ }
      setTimeout(tick, 280);
    };
    tick();
  });
}

/* ───────── 事件 ───────── */

  'pk-add': a => { addItem(PK.listId, a.dataset.pid, PK.store); },
  'pk-inc': a => { const id = itemIdOf(a), it = D.items[id]; if (it) setQty(id, it.qty + 1); },
  'pk-dec': a => { const id = itemIdOf(a), it = D.items[id]; if (!it) return; if (it.qty <= 1) remove('items', id); else setQty(id, it.qty - 1); },
  'pk-newcat': a => { const l = D.lists[PK && PK.listId]; if (!l) return; openEditor(null, { cat: a.dataset.cat, store: PK.store, addTo: PK.listId }); },
  'ed-store': a => {

  'ed-photo': () => pickFile(async f => {

  'member-remove': a => {
    const em = a.dataset.email;
    if (!arm('mb:' + em)) { scheduleRender(); return; }
    SB.from('members').delete().eq('email', em).then(({ error }) => { if (error) onWriteError(error); else { toast('已移除 ' + em); loadMembers().then(scheduleRender); } });

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest && t.closest('[data-scrim]') && t.hasAttribute && t.hasAttribute('data-scrim')) { closeSheet(); return; }
  const go = t.closest('[data-go]'); if (go) { e.preventDefault(); goView(go.dataset.go); return; }
  const a = t.closest('[data-act]');
  const ol = t.closest('[data-open-list]');
  if (ol && !a) { closeOverlay(); goList(ol.getAttribute('data-open-list')); return; }
  if (!a) return;
  if (a.disabled) return;
  const fn = ACT[a.getAttribute('data-act')]; if (fn) { e.preventDefault(); fn(a, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (OVERLAY) closeOverlay(); else if (SHEET) closeSheet(); return; }
  if (OVERLAY && OVERLAY.type === 'clerk') { if (e.key === 'ArrowRight') ACT['clerk-next'](); if (e.key === 'ArrowLeft') ACT['clerk-prev'](); }
  const card = e.target.closest && e.target.closest('.list-card');
  if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); goList(card.getAttribute('data-open-list')); }
});
let tx = null;
overlayRoot.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
overlayRoot.addEventListener('touchend', e => {
  if (tx == null || !OVERLAY || OVERLAY.type !== 'clerk') return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (dx < -60) ACT['clerk-next'](); else if (dx > 60) ACT['clerk-prev']();
}, { passive: true });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'pd-q') { PF.q = t.value; const r = $('#pd-results'); if (r) r.innerHTML = productResults(); }
  else if (t.id === 'pk-q' && PK) { PK.q = t.value; SHEET && SHEET.rerender && SHEET.rerender(); }
  else if (t.id === 'ed-barcode') bcHelp();
  else if (t.id === 'me-carrier' || t.id === 'sh-carrier') {
    const v = normCarrier(t.value), help = $('#' + (t.id === 'me-carrier' ? 'me-carrier-help' : 'sh-carrier-help'));
    if (help) { const ok = /^\/[0-9A-Z.+\-]{7}$/.test(v); help.className = 'help' + (v.length >= 8 ? (ok ? ' ok' : ' warn') : ''); help.textContent = v.length >= 8 ? (ok ? '✓ 格式正確' : '格式不對：斜線開頭，後面 7 碼是大寫英文、數字或 + - .') : ''; }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'list-due') { const ts = fromDateInput(t.value); patch('lists', CUR_LIST, { dueAt: ts }); if (ts) toast('期限：' + fmtDue(ts)); }
  else if (t.id === 'list-remind') { const ts = fromLocalInput(t.value); patch('lists', CUR_LIST, { remindAt: ts }); if (ts) toast('提醒時間：' + fmtRemind(ts)); }
  else if (t.id === 'pk-all' && PK) { PK.all = t.checked; SHEET && SHEET.rerender && SHEET.rerender(); }
  else if (t.id === 'ed-cat' && ED) { ED.d.cat = t.value; $('#ed-name-wrap').hidden = t.value !== 'other'; const s = $('#ed-spec'); if (s) s.placeholder = '例：' + catOf(t.value).hint; if (!ED.d.photo) $('#ed-photo').innerHTML = edPhoto('', t.value); }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'nl-form') createList();
  else if (f.id === 'ed-form') saveEditor();
  else if (f.id === 'login-form') {
    const em = ($('#login-email').value || '').trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { toast('請輸入正確的 Email'); return; }
    SB.auth.signInWithOtp({ email: em, options: { emailRedirectTo: location.origin + location.pathname } }).then(({ error }) => {
      if (error) toast('寄送失敗：' + error.message, 5000); else toast('登入連結已寄到 ' + em + '，去信箱點連結', 6000);
    });
  }
  else if (f.id === 'inv-form') {
    const em = ($('#inv-email').value || '').trim().toLowerCase(), nm = ($('#inv-name').value || '').trim();
    if (!validEmail(em)) { toast('請輸入正確的 Email'); return; }
    if (em === ME) { toast('不用邀請自己'); return; }
    const lid = CUR_LIST;
    inviteToList(lid, em, nm).then(ok => { if (ok) openInviteDone(lid, em); });
  }
  else if (f.id === 'myname-form') {
    const nm = ($('#myname-in').value || '').trim().slice(0, 20);
    MY_NAME = nm;
    Promise.all([SB.from('private_settings').upsert({ email: ME, display_name: nm }), SB.from('list_members').update({ name: nm }).eq('email', ME)])
      .then(rs => { const err = rs.find(x => x.error); if (err) onWriteError(err.error); else toast('名字已儲存'); });
  }
  else if (f.id === 'member-form') {
    const em = ($('#mb-email').value || '').trim().toLowerCase(), nm = ($('#mb-name').value || '').trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { toast('請輸入正確的 Email'); return; }
    SB.from('members').insert({ email: em, display_name: nm || em.split('@')[0] }).then(({ error }) => {
      if (error) toast(error.code === '23505' ? '這個信箱已經在家庭裡了' : '加入失敗：' + error.message, 5000);
      else { toast('已加入 ' + em + '，把網址傳給對方登入就行'); loadMembers().then(scheduleRender); }
    });
  }
  else if (f.id === 'rename-form') { const v = ($('#rename-in').value || '').trim(); if (v) { patch('lists', CUR_LIST, { title: v.slice(0, 30) }); toast('已重新命名'); } closeSheet(true); }
  else if (f.hasAttribute('data-carrier-form')) {
    const inp = f.querySelector('input'), v = normCarrier(inp.value);
    if (!/^\/[0-9A-Z.+\-]{7}$/.test(v)) { toast('載具格式不對：斜線開頭共 8 碼'); inp.focus(); return; }
    saveCarrier(v).then(() => {
      const then = f.getAttribute('data-then');
      if (then) { closeSheet(true); checkout(then, true); } else toast('載具已儲存');
    });
  }
});
$('#file-in').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; const cb = FILE_CB; FILE_CB = null;
  if (f && cb) await cb(f);
});

/* ───────── 啟動 ───────── */
async function boot() {
  const h = (location.hash || '').slice(1);
  if (['lists', 'products', 'history', 'me'].includes(h)) VIEW = h;
  const configured = SUPABASE_URL && SUPABASE_ANON_KEY;
  if (configured && !(window.supabase && window.supabase.createClient)) {
    for (const src of ['https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js', 'https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.4/supabase.min.js']) {
      await new Promise(res => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = res; document.head.appendChild(sc); });
      if (window.supabase && window.supabase.createClient) break;
    }
  }
  if (!configured || !window.supabase || !window.supabase.createClient) {
    if (configured) toast('載入不了 Supabase 程式庫（可能被瀏覽器的追蹤保護擋住），先用單機模式', 8000);
    MODE = 'local'; ME = 'local'; loadLocalData(); loadCarrier(); render({ animate: true }); return;
  }
  render({ animate: true });
  SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  SB.auth.onAuthStateChange((ev, session) => {
    if (ev === 'SIGNED_IN' && session && MODE === 'login') startCloud(session);
    if (ev === 'SIGNED_OUT') location.reload();
  });
  const { data } = await SB.auth.getSession();
  if (!data || !data.session) { MODE = 'login'; render({ animate: true }); return; }
  await startCloud(data.session);
}
let started = false;
async function startCloud(session) {
  if (started) return; started = true;
  ME = String(session.user.email || '').toLowerCase();
  if (location.hash.includes('access_token')) history.replaceState(null, '', location.pathname);
  MODE = 'cloud';
  try { await loadLM(); } catch (e) { toast('讀取共用名單失敗，請確認已經執行過最新的 SQL：' + (e.message || ''), 8000); }
  try { await cloudLoadAll(); } catch (e) { toast('讀取雲端資料失敗：' + (e.message || ''), 5000); }
  subscribeRealtime();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && MODE === 'cloud') cloudLoadAll().catch(() => {}); });
  loadCarrier();
  render({ animate: true });
}
boot();
})();
